<!DOCTYPE html>
<html lang="en" data-theme="voidframe">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trade List</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
        <link href="./index.css" rel="stylesheet">
        <script src="./index.js" defer></script>
    </head>
    <body class="relative flex min-h-screen p-4 flex-col gap-4 bg-base-100">
        <div class="void-grid-fixed" aria-hidden="true"></div>
        <div class="tabs tabs-lift tabs-xl relative z-10">
            <input id="want-input" type="radio" name="tabs" class="tab" aria-label="Karten die ich brauche" checked="checked" />
            <div class="tab-content bg-base-200 p-4">
                <div class="flex flex-col gap-4">
                    <div class="join w-1/3">
                        <input id="needs-name-filter" type="text" class="input input-bordered input-neutral join-item" placeholder="Namensfilter" oninput="setNameFilter('want', event)">
                        <div class="dropdown join-item border-transparent">
                            <div tabindex="0" id="needs-rarity-display" role="button" class="btn btn-neutral flex w-20 items-center">
                                <span id="needs-rarity-label">Alle</span>
                            </div>
                            <ul tabindex="0" id="needs-rarity-menu" class="dropdown-content menu bg-base-300 border border-border z-10 w-24 p-2"></ul>
                        </div>
                    </div>
                    <div id="need-sets-accordions" class="join join-vertical bg-base-300 border border-border"></div>
                </div>
            </div>

            <input type="radio" name="tabs" aria-label="Karten die ich habe" class="tab" />
            <div class="tab-content bg-base-200 p-4">
                <div class="flex flex-col gap-4">
                    <div class="join w-1/3">
                        <input id="have-name-filter" type="text" class="input input-bordered input-neutral join-item" placeholder="Namensfilter" oninput="setNameFilter('have', event)">
                        <div class="dropdown join-item border-transparent">
                            <div tabindex="0" id="have-rarity-display" role="button" class="btn btn-neutral flex w-20 items-center">
                                <span id="have-rarity-label">Alle</span>
                            </div>
                            <ul tabindex="0" id="have-rarity-menu" class="dropdown-content menu bg-base-300 border border-border z-10 w-24 p-2"></ul>
                        </div>
                    </div>
                    <div id="have-sets-accordions" class="join join-vertical bg-base-300 border border-border"></div>
                </div>
            </div>

            <input id="trade-list-input" type="radio" name="tabs" aria-label="Angebotsübersicht" class="tab tab-disabled" />
            <div class="tab-content bg-base-200 p-4">
                <div class="flex flex-col gap-4">
                    <div class="card flex w-1/2 h-fit p-4 flex-col gap-4 bg-base-300">
                        <div class="flex items-center justify-between text-lg font-bold">
                            <h3 class="px-2">Export</h3>
                            <button class="btn btn-primary" onclick="generateExport()">Export</button>
                        </div>
                        <textarea id="export-field" class="textarea textarea-neutral w-full resize-none" placeholder="Tauschliste exportiert" spellcheck="false"></textarea>
                    </div>
                    <div id="trade-list" class="trade-list-grid grid gap-4"></div>
                </div>
            </div>
        </div>
        <div id="toast" class="toast toast-top toast-center"></div>
    </body>
</html>
